<!doctype html>
<!--
  Pboard Live Debug Bridge dashboard.
  Local-only diagnostic surface served by the bridge at /ui. Reads the same
  loopback endpoints the MCP tools use; token comes from the URL bar once
  (#token=…) and lives only in this page's memory. No build step, no CDN.
-->
<meta charset="utf-8" />
<title>Pboard Debug Bridge</title>
<style>
  :root { color-scheme: light dark; --bg: light-dark(#fff, #16181d); --fg: light-dark(#1b1e24, #e6e9ef); --muted: light-dark(#67707f, #98a1b3); --line: light-dark(#d6dae1, #333944); --accent: #4c7dff; --err: #d8434b; --warn: #b7791f; --ok: #2f8f4e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 ui-monospace, "SF Mono", "Cascadia Mono", monospace; background: var(--bg); color: var(--fg); }
  header { display: flex; gap: 16px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; }
  .stat { color: var(--muted); }
  .stat b { color: var(--fg); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 0; height: calc(100vh - 44px); }
  section { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 14px; }
  aside { overflow-y: auto; padding: 10px 14px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }
  #events { display: flex; flex-direction: column-reverse; gap: 1px; }
  .row { display: grid; grid-template-columns: 86px 40px 150px 1fr; gap: 8px; padding: 1px 4px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .row:hover { background: light-dark(#f0f3f8, #1e222a); }
  .row .sev-warn { color: var(--warn); } .row .sev-error { color: var(--err); font-weight: 600; } .row .sev-debug { color: var(--muted); }
  .row .comp { color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
  .row .det { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
  .card .k { color: var(--muted); }
  .finding { border-left: 3px solid var(--warn); }
  .finding.error { border-left-color: var(--err); }
  .conn-state-open { color: var(--ok); } .conn-state-closed { color: var(--muted); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  input, select, button { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; }
  button { cursor: pointer; }
  .pill { border-radius: 10px; padding: 0 8px; border: 1px solid var(--line); color: var(--muted); }
  .pill.on { color: var(--ok); border-color: var(--ok); }
  dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); max-width: 820px; padding: 14px; }
  dialog pre { white-space: pre-wrap; word-break: break-all; }
</style>
<header>
  <h1>Pboard Debug Bridge</h1>
  <span class="stat" id="status">connecting…</span>
  <span class="pill" id="live">live</span>
</header>
<main>
  <section>
    <div class="toolbar">
      <select id="component"><option value="">all components</option></select>
      <input id="text" placeholder="text filter…" size="14" />
      <select id="severity">
        <option value="">any severity</option><option>error</option><option>warn</option><option>info</option><option>debug</option>
      </select>
      <button id="pause">pause</button>
      <button id="clear">clear</button>
    </div>
    <div id="events"></div>
  </section>
  <aside>
    <h2>Clients</h2><div id="clients" class="muted">—</div>
    <h2>Connections <span id="connCounts" class="muted"></span></h2><div id="connections">—</div>
    <h2>Findings</h2><div id="findings">—</div>
    <h2>Recent traces</h2><div id="traces">—</div>
  </aside>
</main>
<dialog id="detail"><pre id="detailBody"></pre></dialog>
<script>
const params = new URLSearchParams(location.search);
const token = (location.hash.match(/token=([^&]+)/) || [])[1] ?? params.get("token") ?? "";
const $ = (id) => document.getElementById(id);
let paused = false, cursor = "0", seen = new Set();

function api(path) {
  const url = new URL(path, location.origin);
  if (token) url.searchParams.set("token", token);
  return fetch(url).then(async (r) => { if (!r.ok) throw new Error(path + " -> " + r.status); return r.json(); });
}
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
function time(iso) { return (iso || "").slice(11, 23); }

function rowFor(event) {
  const row = el("div", "row");
  row.append(
    el("span", "", time(event.receivedAt)),
    el("span", "sev-" + event.severity, event.severity.slice(0, 4)),
    el("span", "comp", event.component + "/" + event.event),
    el("span", "det", `${event.clientId ?? ""} ${event.connectionId ?? event.operationId ?? ""} ${JSON.stringify(event.details ?? {})}`)
  );
  row.title = `${event.clientId ?? "?"} session=${event.sessionId ?? "?"} board=${event.boardId ?? "-"} trace=${event.traceId ?? "-"}`;
  row.onclick = () => { $("detailBody").textContent = JSON.stringify(event, null, 2); $("detail").showModal(); };
  return row;
}

async function pollEvents() {
  if (paused || document.hidden) return;
  const filter = {};
  if ($("component").value) filter.component = $("component").value;
  if ($("text").value) filter.text = $("text").value;
  if ($("severity").value) filter.severity = [$("severity").value];
  const query = new URLSearchParams({ after: cursor, limit: "200" });
  if (Object.keys(filter).length) query.set("filter", JSON.stringify(filter));
  let result;
  try { result = await api("/events?" + query); } catch (error) { $("status").textContent = String(error.message); return; }
  cursor = result.nextCursor;
  for (const event of result.events) {
    if (seen.has(event.bridgeSeq)) continue;
    seen.add(event.bridgeSeq);
    $("events").append(rowFor(event));
  }
  while ($("events").children.length > 2000) $("events").firstChild.remove();
  if (result.bufferOverflown) $("status").classList.add("sev-warn");
}

async function pollSidebar() {
  if (document.hidden) return;
  try {
    const [status, clients, connections, checkData, traces] = await Promise.all([
      api("/status"), api("/clients"), api("/connections"), api("/connections/checks"), api("/traces?limit=6"),
    ]);
    $("status").textContent = `mode ${status.mode} · ${status.eventBufferLength}/${status.eventBufferCapacity} events · overflow ${status.droppedByOverflow} · rejected ${status.rejectedEvents} · clients ${status.clients}`;
    $("clients").replaceChildren(...clients.map((client) => {
      const card = el("div", "card");
      card.append(el("div", "", client.clientId), el("div", "k", `${client.contexts.join(",")} · ${client.eventCount} events · last ${time(client.lastSeen)}`));
      return card;
    }));
    const entries = connections.connections ?? [];
    $("connCounts").textContent = `(${entries.filter((e) => e.state === "open").length} open / ${entries.length})`;
    $("connections").replaceChildren(...entries.slice(-24).reverse().map((entry) => {
      const card = el("div", "card");
      card.append(
        el("div", "conn-state-" + entry.state, `${entry.state}  ${entry.connectionId}`),
        el("div", "k", `${entry.clientId ?? "?"} ${entry.trigger ?? ""} ${entry.room ?? ""} ${entry.closeCode ?? ""}`)
      );
      return card;
    }));
    $("findings").replaceChildren(...(checkData.findings.length
      ? checkData.findings.map((finding) => {
          const card = el("div", "card finding " + finding.severity);
          card.append(el("div", "", `${finding.kind}: ${finding.summary}`), el("div", "k", finding.connectionIds.join(", ")));
          return card;
        })
      : [el("div", "k", "none")]));
    $("traces").replaceChildren(...traces.map((trace) => {
      const card = el("div", "card");
      card.append(
        el("div", "", `${trace.traceId.slice(0, 18)} ${trace.complete ? "✓ complete" : `missing ${trace.missingStages.length}`}`),
        el("div", "k", trace.stages.map((stage) => stage.event).slice(0, 6).join(" → "))
      );
      if (trace.errors.length) card.append(el("div", "sev-error", `${trace.errors.length} error stage(s)`));
      return card;
    }));
  } catch (error) { /* sidebar refresh best-effort */ }
}

$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "resume" : "pause"; $("live").classList.toggle("on", !paused); };
$("clear").onclick = () => { $("events").replaceChildren(); seen.clear(); };
for (const component of ["websocket", "auth", "sync", "persistence", "drive", "lifecycle", "relay", "harness", "debug"])
  $("component").append(new Option(component, component));
$("live").classList.add("on");

pollEvents(); pollSidebar();
setInterval(pollEvents, 1000);
setInterval(pollSidebar, 2000);
</script>

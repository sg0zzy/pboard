name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [firefox, chromium, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/android/package-lock.json
      - run: npm ci
      - run: node scripts/sync-version.mjs --check
      - if: matrix.target != 'android'
        run: npm run typecheck && npm test
      - if: matrix.target == 'android'
        run: npm ci && npm run typecheck && npm test
        working-directory: apps/android
      - if: matrix.target == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify test-only packages
        env:
          TARGET: ${{ matrix.target }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/build_all.sh "$TARGET"
      - name: Preserve verified temporary output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pboard-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: local_artifacts/*/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve incomplete diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: incomplete-pboard-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: local_artifacts/*/build-info.json
          if-no-files-found: ignore
          retention-days: 14

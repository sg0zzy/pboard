name: Beta Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Reviewed branch/SHA, or existing beta tag for exact-source retry
        type: string
        default: main
      core:
        description: Optional explicit beta core X.Y.Z
        type: string
        required: false
permissions:
  contents: read
# One repository-wide lock for allocation, build, staging and visibility.
concurrency:
  group: official-release-lifecycle
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      control: ${{ steps.control.outputs.sha }}
      artifact_attempt: ${{ steps.control.outputs.attempt }}
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - id: control
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Validate source, history, configuration and reservation
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: beta
          SELECTOR: ${{ inputs.ref }}
          CORE: ${{ inputs.core }}
        run: node scripts/release-control.mjs validate "$CHANNEL" "$SELECTOR" "$CORE"
      - name: Preserve reservation or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-record/
          if-no-files-found: error
          retention-days: 90
  build:
    needs: validate
    if: needs.validate.outputs.already_published != 'true'
    uses: ./.github/workflows/build-targets.yml
    with:
      sha: ${{ needs.validate.outputs.sha }}
      control: ${{ needs.validate.outputs.control }}
      version: ${{ needs.validate.outputs.version }}
      artifact_attempt: ${{ needs.validate.outputs.artifact_attempt }}
  stage:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.control }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verified-*-${{ github.run_id }}-${{ needs.validate.outputs.artifact_attempt }}
          path: verified-output
      - name: Prepare manifest and complete notes for human review
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: beta
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: node scripts/release-control.mjs stage "$CHANNEL" "$VERSION" "$SOURCE_SHA" verified-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan-${{ github.run_id }}-${{ needs.validate.outputs.artifact_attempt }}
          path: release-staging/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: [validate, build, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.control }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verified-*-${{ github.run_id }}-${{ needs.validate.outputs.artifact_attempt }}
          path: verified-output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-plan-${{ github.run_id }}-${{ needs.validate.outputs.artifact_attempt }}
          path: reviewed-release-plan
      - name: Verify aggregate outputs, stage draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: beta
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: node scripts/release-control.mjs publish "$CHANNEL" "$VERSION" "$SOURCE_SHA" verified-output
      - name: Preserve publication or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-record/
            release-staging/
          if-no-files-found: error
          retention-days: 90

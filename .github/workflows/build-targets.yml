name: Official target builds
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      control:
        required: true
        type: string
      artifact_attempt:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [firefox, chromium, android-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: matrix.target == 'android-release'
        run: npm ci
        working-directory: apps/android
      - if: matrix.target == 'android-release'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build exact committed source
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          export BUILD_STARTED_AT="$(date -u +%FT%TZ)"
          node scripts/release-build.mjs "$TARGET" "$VERSION" "$SOURCE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target == 'android-release' && 'awaiting-signature' || 'verified' }}-${{ matrix.target }}-${{ github.run_id }}-${{ inputs.artifact_attempt }}
          path: official-output/
          if-no-files-found: error
          retention-days: 14
  sign-android:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.control }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: awaiting-signature-android-release-${{ github.run_id }}-${{ inputs.artifact_attempt }}
          path: signing-input
      - name: Select Android verification tools
        run: echo "ANDROID_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Sign and verify final APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/sign-android.mjs signing-input
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-android-release-${{ github.run_id }}-${{ inputs.artifact_attempt }}
          path: signing-input/
          if-no-files-found: error
          retention-days: 14

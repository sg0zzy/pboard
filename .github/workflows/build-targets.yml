name: Official target builds
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      control:
        required: true
        type: string
      artifact_attempt:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [firefox, chromium, android-release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: matrix.target == 'android-release'
        run: npm ci
        working-directory: apps/android
      - if: matrix.target == 'android-release'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build exact committed source
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          export BUILD_STARTED_AT="$(date -u +%FT%TZ)"
          node scripts/release-build.mjs "$TARGET" "$VERSION" "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target == 'android-release' && 'awaiting-signature' || 'verified' }}-${{ matrix.target }}-${{ github.run_id }}-${{ inputs.artifact_attempt }}
          path: official-output/
          if-no-files-found: error
          retention-days: 14
  sign-android:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.control }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: awaiting-signature-android-release-${{ github.run_id }}-${{ inputs.artifact_attempt }}
          path: signing-input
      - name: Select Android verification tools
        run: echo "ANDROID_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Sign and verify final APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/sign-android.mjs signing-input
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-android-release-${{ github.run_id }}-${{ inputs.artifact_attempt }}
          path: signing-input/
          if-no-files-found: error
          retention-days: 14
